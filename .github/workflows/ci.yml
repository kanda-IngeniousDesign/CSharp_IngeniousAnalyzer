name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CSharp_IngeniousAnalyzer.Tests/CSharp_IngeniousAnalyzer.Tests.csproj

      - name: Build
        run: dotnet build CSharp_IngeniousAnalyzer.Tests/CSharp_IngeniousAnalyzer.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test CSharp_IngeniousAnalyzer.Tests/CSharp_IngeniousAnalyzer.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
